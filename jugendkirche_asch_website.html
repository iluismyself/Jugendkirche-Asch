<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <title>Jugendkirche Asch</title>
  <meta name="description" content="Lerne die Jugendkirche Asch kennen – schön, dass du da bist.">
  <style>
    :root {
      --paper: #F8F7F2;
      --ink: #22252b;
      --muted: #686c75;
      --cyan: #BDEFF0;
      --orange: #F4D4BD;
      --lilac: #DCCFF5;
      --pink: #F4D6E6;
      --white: rgba(255,255,255,.78);
      --line: rgba(35, 39, 47, .09);
      --shadow: 0 22px 70px rgba(40, 47, 60, .09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 12%, rgba(189,239,240,.48), transparent 34rem),
        radial-gradient(ellipse at 92% 25%, rgba(220,207,245,.42), transparent 30rem),
        radial-gradient(ellipse at 60% 100%, rgba(244,212,189,.35), transparent 34rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: min(100% - 32px, 900px); margin: 0 auto; padding: 22px 0 32px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding: 8px 2px 28px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:650; letter-spacing:-.02em; }
    .brand-mark {
      width:36px; height:36px; display:grid; place-items:center; border-radius:13px;
      background:linear-gradient(145deg,var(--cyan),var(--lilac)); font-size:18px;
      box-shadow: 0 5px 18px rgba(100,120,150,.12);
    }
    .pill { font-size:12px; color:#555b64; padding:8px 12px; border:1px solid var(--line); border-radius:99px; background:rgba(255,255,255,.55); }
    main { min-height: 68vh; display:grid; place-items:center; }
    .panel {
      width:100%; max-width:700px; position:relative; overflow:hidden;
      padding: clamp(26px, 6vw, 58px); border:1px solid rgba(255,255,255,.85);
      border-radius:32px; background:var(--white); backdrop-filter: blur(22px);
      box-shadow:var(--shadow); animation: rise .7s cubic-bezier(.2,.75,.25,1) both;
    }
    .orb { position:absolute; width:190px; height:190px; border-radius:50%; filter:blur(1px); opacity:.55; pointer-events:none; }
    .orb.one { right:-82px; top:-90px; background:var(--lilac); }
    .orb.two { left:-105px; bottom:-125px; background:var(--cyan); }
    .content { position:relative; z-index:1; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; color:#5c6870; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.13em; margin-bottom:20px; }
    .dot { width:7px; height:7px; background:#79c9ce; border-radius:50%; box-shadow:0 0 0 4px rgba(121,201,206,.16); }
    h1 { font-size:clamp(38px, 7.5vw, 68px); line-height:.99; letter-spacing:-.065em; margin:0 0 20px; font-weight:750; max-width:620px; }
    p { font-size:clamp(16px, 2.5vw, 18px); line-height:1.65; color:var(--muted); margin:0 0 28px; max-width:560px; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:28px; }
    button, a.button {
      font:inherit; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:space-between; gap:14px;
      min-height:58px; padding:16px 18px; border:1px solid var(--line); border-radius:17px;
      color:var(--ink); background:rgba(255,255,255,.78); font-weight:650; font-size:15px;
      transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    button:hover, a.button:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(35,39,47,.08); }
    button:focus-visible, a.button:focus-visible { outline:3px solid #77cfd2; outline-offset:3px; }
    .primary { background:var(--ink); color:white; border-color:var(--ink); }
    .primary:hover { background:#373b44; }
    .cyan { background:rgba(189,239,240,.6); }
    .orange { background:rgba(244,212,189,.6); }
    .lilac { background:rgba(220,207,245,.65); }
    .pink { background:rgba(244,214,230,.65); }
    .arrow { font-size:20px; line-height:1; opacity:.72; }
    .small-links { display:flex; gap:18px; flex-wrap:wrap; margin-top:25px; }
    .text-button { border:0; background:none; color:#737782; font-size:13px; padding:7px 0; min-height:auto; justify-content:flex-start; }
    .text-button:hover { box-shadow:none; transform:none; color:var(--ink); }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:24px 3px 0; color:#898b90; font-size:12px; }
    .progress { height:3px; width:100%; background:rgba(34,37,43,.07); border-radius:99px; overflow:hidden; margin:0 0 28px; }
    .progress span { display:block; height:100%; width:25%; background:linear-gradient(90deg,#8ddadd,#c7b4f0); border-radius:99px; transition:width .4s ease; }
    .tag { display:inline-block; padding:7px 10px; border-radius:99px; background:rgba(220,207,245,.55); font-size:12px; color:#625579; margin-bottom:18px; }
    .hidden { display:none !important; }
    @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.99); } to { opacity:1; transform:translateY(0) scale(1); } }
    @media (max-width:600px) {
      .wrap { width:min(100% - 22px, 900px); padding-top:12px; }
      header { padding-bottom:18px; }
      .panel { border-radius:26px; padding:28px 22px; }
      .buttons { grid-template-columns:1fr; }
      .footer { align-items:flex-start; flex-direction:column; }
      .pill { font-size:11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>Jugendkirche Asch</span></div>
      <span class="pill">Ein Ort zum Ankommen</span>
    </header>

    <main>
      <section class="panel" aria-live="polite">
        <div class="orb one"></div><div class="orb two"></div>
        <div class="content">
          <div class="progress" aria-hidden="true"><span id="progress"></span></div>
          <div id="screen">
            <div class="eyebrow"><span class="dot"></span> Schön, dass du hier bist</div>
            <h1>Hey du.<br>Eine kleine Frage.</h1>
            <p>Glaube, Leben und große Fragen müssen nicht kompliziert sein. Klick dich einfach durch – ganz ohne Druck.</p>
            <div class="buttons">
              <button class="primary" data-next="jesus">Los geht’s <span class="arrow">↗</span></button>
              <button class="cyan" data-next="visit">Ich schau mich um <span class="arrow">→</span></button>
            </div>
          </div>
          <div class="small-links">
            <button class="text-button" id="restart" type="button">↺ Von vorne starten</button>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <span>Jugendkirche Asch · Du bist willkommen.</span>
      <span>Keine Anmeldung. Keine Datensammlung.</span>
    </footer>
  </div>
  <script>
    const screens = {
      home: {
        progress: 15,
        eyebrow: "Schön, dass du hier bist",
        title: "Hey du.<br>Eine kleine Frage.",
        body: "Glaube, Leben und große Fragen müssen nicht kompliziert sein. Klick dich einfach durch – ganz ohne Druck.",
        buttons: [
          ["Los geht’s", "jesus", "primary"],
          ["Ich schau mich um", "visit", "cyan"]
        ]
      },
      jesus: {
        progress: 35,
        eyebrow: "Mal ganz ehrlich",
        title: "Kennst du Jesus?",
        body: "Es gibt kein Richtig oder Falsch. Wir sind einfach neugierig, wo du gerade stehst.",
        buttons: [
          ["Ja, ein bisschen", "yesJesus", "lilac"],
          ["Ich würde gern mehr wissen", "curious", "cyan"],
          ["Ich bin mir nicht sicher", "unsure", "orange"],
          ["Zurück", "home", ""]
        ]
      },
      yesJesus: {
        progress: 65,
        eyebrow: "Wie schön",
        title: "Dann lass uns connecten.",
        body: "Glaube muss man nicht allein leben. Bei der Jugendkirche Asch ist Platz für Gemeinschaft, Fragen und echte Gespräche.",
        buttons: [
          ["Warst du schon mal bei uns?", "visit", "primary"],
          ["Nochmal zurück", "jesus", ""]
        ]
      },
      curious: {
        progress: 65,
        eyebrow: "Neugierig sein ist gut",
        title: "Du darfst Fragen haben.",
        body: "Du musst nicht alles wissen oder schon eine Meinung haben. Komm vorbei, lern Leute kennen und entdecke in deinem Tempo, was Glaube für dich bedeuten kann.",
        buttons: [
          ["Warst du schon mal bei uns?", "visit", "primary"],
          ["Nochmal zurück", "jesus", ""]
        ]
      },
      unsure: {
        progress: 65,
        eyebrow: "Alles gut",
        title: "Du musst es nicht wissen.",
        body: "Manche Fragen brauchen Zeit. Du kannst einfach vorbeikommen, zuhören, mitreden oder erst mal nur schauen.",
        buttons: [
          ["Warst du schon mal bei uns?", "visit", "primary"],
          ["Nochmal zurück", "jesus", ""]
        ]
      },
      visit: {
        progress: 78,
        eyebrow: "Lern uns kennen",
        title: "Warst du schon mal bei der Jugendkirche Asch?",
        body: "Egal, ob du schon da warst oder zum ersten Mal von uns hörst – du bist willkommen.",
        buttons: [
          ["Ja, ich war schon da", "beenThere", "lilac"],
          ["Nein, noch nie", "newHere", "orange"],
          ["Zurück", "jesus", ""]
        ]
      },
      beenThere: {
        progress: 100,
        eyebrow: "Willkommen zurück",
        title: "Schön, dass du uns kennst!",
        body: "Vielleicht sehen wir uns ja bald wieder. Bring gern jemanden mit, wenn du magst.",
        buttons: [
          ["Nochmal von vorne", "home", "primary"],
          ["Noch eine Frage", "age", "cyan"]
        ]
      },
      newHere: {
        progress: 100,
        eyebrow: "Dann wird’s Zeit",
        title: "Komm einfach mal vorbei.",
        body: "Du musst niemanden kennen und nichts vorbereiten. Schau in der Jugendkirche Asch vorbei und finde heraus, ob es sich für dich gut anfühlt.",
        buttons: [
          ["Noch eine Frage", "age", "primary"],
          ["Nochmal von vorne", "home", ""]
        ]
      },
      age: {
        progress: 100,
        eyebrow: "Noch kurz",
        title: "Bist du zwischen 14 und 20?",
        body: "Wir fragen nur, damit du einschätzen kannst, ob unsere Jugendangebote zu dir passen. Deine Antwort wird nicht gespeichert.",
        buttons: [
          ["Ja, ungefähr", "welcome", "cyan"],
          ["Nein", "allWelcome", "orange"],
          ["Zurück", "visit", ""]
        ]
      },
      welcome: {
        progress: 100,
        eyebrow: "Das passt",
        title: "Dann lern uns kennen!",
        body: "Wir freuen uns, wenn du bei der Jugendkirche Asch vorbeischaust. Komm, wie du bist – wir freuen uns auf dich.",
        buttons: [
          ["Von vorne starten", "home", "primary"]
        ]
      },
      allWelcome: {
        progress: 100,
        eyebrow: "Du bist willkommen",
        title: "Schön, dass du da bist.",
        body: "Auch wenn du nicht in diese Altersgruppe fällst, darfst du dich gern informieren und schauen, was für dich passt.",
        buttons: [
          ["Von vorne starten", "home", "primary"]
        ]
      }
    };

    const screen = document.getElementById("screen");
    const progress = document.getElementById("progress");
    function render(id) {
      const data = screens[id] || screens.home;
      progress.style.width = data.progress + "%";
      screen.innerHTML = `
        <div class="eyebrow"><span class="dot"></span>${data.eyebrow}</div>
        <h1>${data.title}</h1>
        <p>${data.body}</p>
        <div class="buttons">${data.buttons.map(([label,next,style]) =>
          `<button type="button" class="${style}" data-next="${next}">${label}<span class="arrow">→</span></button>`
        ).join("")}</div>`;
      screen.querySelectorAll("[data-next]").forEach(button => {
        button.addEventListener("click", () => {
          render(button.dataset.next);
          screen.closest(".panel").animate(
            [{opacity:.65, transform:"translateY(6px) scale(.995)"},{opacity:1,transform:"translateY(0) scale(1)"}],
            {duration:280, easing:"ease-out"}
          );
        });
      });
    }
    document.getElementById("restart").addEventListener("click", () => render("home"));
    render("home");
  </script>
</body>
</html>
